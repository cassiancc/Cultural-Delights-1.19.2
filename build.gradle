plugins {
	id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}

version = project.version + "-refabricated"
group = project.group

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    
	exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }

     exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "BlameJared"
                url = "https://maven.blamejared.com"
            }
        }
        filter {
            includeGroup "mezz.jei"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "MehVahdJukaar"
                url = "https://maven.mehvahdjukaar.com"
            }
        }
        filter {
            includeGroup "net.mehvahdjukaar"
        }
    }
    mavenLocal()
}

dependencies {
    // Farmer's Delight
    compileOnly "maven.modrinth:farmers-delight-refabricated:${farmers_delight_version}"
    runtimeOnly "maven.modrinth:farmers-delight-refabricated:${farmers_delight_version}"

    // Supplementaries
    compileOnly "maven.modrinth:supplementaries:${supplementaries_version}"
//    runtimeOnly "maven.modrinth:supplementaries:${supplementaries_version}"
    compileOnly "maven.modrinth:moonlight:26.1.2-4.2.2"
//    runtimeOnly "maven.modrinth:moonlight:26.1.2-4.2.2"

    // Every Compat
//    runtimeOnly "maven.modrinth:every-compat:LOJjzOOP"

    // RRV
    compileOnly "maven.modrinth:rrv:${rrv_version}-fabric"
    runtimeOnly "maven.modrinth:rrv:${rrv_version}-fabric"

    // JEI
    compileOnly "mezz.jei:jei-26.1.2-fabric-api:${jei_version}"
    //runtimeOnly "mezz.jei:jei-26.1.2-fabric:${jei_version}"
    
    // Modest Magic
    compileOnly "maven.modrinth:modest-magic:${modest_magic_version}"

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "maven.modrinth:modmenu:18.0.2"
    implementation("cc.cassian.asphodel:asphodel-api-fabric:1.1.3+${minecraft_version}")
    include("cc.cassian.asphodel:asphodel-api-fabric:1.1.3+${minecraft_version}")
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version,
    ]

    filesMatching("fabric.mod.json") {
        expand expandProps
    }
    inputs.properties(expandProps)
    exclude("**/neoforge.mods.toml", "**/accesstransformer.cfg", "**/enumextensions.json", "**/data/neoforge/**", "**/data/culturaldelights/loot_modifiers/**", "**/data/culturaldelights/neoforge/**")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	it.options.release = 25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}


loom {
    accessWidenerPath = file("src/main/resources/culturaldelights.classtweaker")
}


publishMods {
    file = tasks.named("jar").flatMap { it.archiveFile }
    changelog = rootProject.file("CHANGELOG-LATEST.md").text
    type = STABLE
    version = "${project.version}-${minecraft_version}"
    displayName = "${mod_name} ${minecraft_version} - ${project.version}"
    modLoaders.add('neoforge')

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "574622"
        minecraftVersions.add("${minecraft_version}")
        client = true
        server = true

        requires("farmers-delight")
        optional("supplementaries")
        optional("jei")
        optional("emi")
        optional("appleskin")
        incompatible("cooks-collection")
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "YttyNOFA"
        minecraftVersions.add("${minecraft_version}")

        requires("farmers-delight")
        optional("supplementaries")
        optional("jei")
        optional("emi")
        optional("appleskin")
        incompatible("cooks-collection")
    }
}

